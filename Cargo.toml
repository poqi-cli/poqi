[workspace]
members = [
    "crates/app",
    "crates/ui",
    "crates/engine",
    "crates/db",
    "crates/catalog",
    "crates/search/completion",
    "crates/search/fuzzy",
    "crates/search/semantic",
    "crates/search/ranker",
    "crates/store",
    "crates/config",
    "crates/observability",
    "crates/tools/testdata",
    "crates/tools/test-support",
]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
aes-gcm = { version = "0.10.3", features = ["std", "getrandom"] }
anyhow = "1.0"
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
config = { package = "config", version = "0.14", default-features = false, features = ["toml"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
directories = "5.0"
futures = "0.3"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
parking_lot = "0.12"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache", "macros", "all-widgets"] }
rusqlite = { version = "0.30", features = ["chrono", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.15"
sha2 = "0.10"
tar = "0.4"
thiserror = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
url = "2.5"
rand = "0.8"
uuid = { version = "1.18", features = ["v4"] }
testcontainers = "0.27"
unicode-segmentation = "1.12"
unicode-width = "0.1"
zip = "0.6"
pg_query = "6.1.1"
prost-build = "0.14.1"
smallvec = "1.15"
ndarray = "0.15"
num_cpus = "1.16"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
