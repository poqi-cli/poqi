name: Native credential stores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Commit to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  credential-store:
    name: credential store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Store and configuration regression tests
        run: cargo test -p poqi-store -p poqi-config --locked
      - name: Native Windows or macOS credential store
        if: runner.os != 'Linux'
        run: cargo test -p poqi-store --locked tests::native_keyring_round_trip_smoke -- --ignored --exact --nocapture
      - name: Install Linux Secret Service test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      - name: Native Linux Secret Service in an isolated session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$RUNNER_TEMP/poqi-keyring-test"
          export XDG_DATA_HOME="$HOME/.local/share" XDG_RUNTIME_DIR="$HOME/runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$HOME" "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail -c '
            printf test-only-keyring-password | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p poqi-store --locked tests::native_keyring_round_trip_smoke -- --ignored --exact --nocapture
          '
