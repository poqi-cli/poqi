name: Native credential stores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Commit to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  credential-store:
    name: credential store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Store and configuration regression tests
        run: cargo test -p poqi-store -p poqi-config --locked
      - name: Linux application graph excludes the previous D-Bus backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          linux_tree=$(cargo tree --locked --target x86_64-unknown-linux-gnu \
            -p poqi-app -e normal --prefix none)
          if printf '%s\n' "$linux_tree" | \
            grep -Eq '^(dbus-secret-service|dbus|libdbus-sys) v'; then
            echo "Linux application graph unexpectedly contains the previous D-Bus backend" >&2
            exit 1
          fi
      - name: Native Windows or macOS credential store
        if: runner.os != 'Linux'
        run: cargo test -p poqi-store --locked tests::native_keyring_ -- --ignored --nocapture
      - name: Install Linux Secret Service test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      - name: Native Linux Secret Service in an isolated session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/poqi-keyring-test/data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/poqi-keyring-test/runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail -c '
            printf test-only-keyring-password | gnome-keyring-daemon --unlock --components=secrets
            timeout 2m cargo test -p poqi-store --locked tests::native_keyring_ -- --ignored --nocapture
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" bash ./scripts/test-linux-keyring-compatibility.sh
          '
      - name: Locked Linux Secret Service fails closed
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/poqi-locked-keyring-test/data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/poqi-locked-keyring-test/runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail -c '
            printf test-only-keyring-password | gnome-keyring-daemon --unlock --components=secrets
            gdbus call --session --dest org.freedesktop.secrets \
              --object-path /org/freedesktop/secrets \
              --method org.freedesktop.Secret.Service.Lock \
              "[objectpath \"/org/freedesktop/secrets/collection/login\"]"
            timeout 30s cargo test -p poqi-store --locked \
              tests::linux_locked_keyring_fails_closed -- --ignored --exact --nocapture
          '
